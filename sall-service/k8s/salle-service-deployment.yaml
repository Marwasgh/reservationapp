apiVersion: apps/v1
kind: Deployment
metadata:
  name: sall-service-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sall-service
  template:
    metadata:
      labels:
        app: sall-service  
    spec:
      containers:
        - name: sall-service  
          image: marwasghaier22/sall_service:latest
          ports:
            - containerPort: 8001
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:password@postgres:5432/salledb"
            - name: KAFKA_BROKER
              value: "kafka:9092"